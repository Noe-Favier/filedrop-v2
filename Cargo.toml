[package]
name = "filedrop-v2"
version = "2.0.0"
edition = "2021"

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
strip = true

[dependencies]
# Base
tokio = { version = "1.44.2", features = ["rt", "rt-multi-thread", "macros"] }
dotenv = "0.15.0"
mime_guess = "2.0.5"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
chrono = { version = "0.4.40", features = ["serde"] }

# File/folder support
zip = "2.5.0"
tempfile = "3.19.1"
walkdir = "2.5.0"

# Poem web framework
poem = { version = "2.0.0", features = ["multipart", "websocket", "compression", "cookie"] }
# Error handling
thiserror = "1.0.58"
# Logging & tracing
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
poem-openapi = { version = "2.0.0", features = ["swagger-ui"] }
